# cargo-deny configuration: enforce the permissive-only dependency policy.
# See docs/adr/0001-permissive-only-dependency-policy.md.

[licenses]
# Copyleft (GPL/AGPL/LGPL/SSPL/MPL) is denied project-wide.
copyleft = "deny"
# Allowlist of permissive licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Licenses that cannot be determined with confidence are an error.
confidence-threshold = 0.8
# Ignore our own non-published workspace crates.
private = { ignore = true }
# Per-crate exceptions (package name -> license). Add only via a new ADR.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
