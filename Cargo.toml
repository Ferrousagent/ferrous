[workspace]
resolver = "2"
members = ["ferrous-core", "ferrous-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# One source of truth for dependency versions across all crates.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
postcard = { version = "1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tempfile = "3"

# Zero-bloat release binaries: small, fast, no debug symbols.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
