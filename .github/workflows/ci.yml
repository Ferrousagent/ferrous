name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
  schedule:
    # Nightly advisory sweep: RustSec advisories can be published any day.
    - cron: '0 0 * * *'
  workflow_dispatch:

# Kill stale runs when a newer push lands on the same branch.
# TEMP-DEBUG: contents:write lets the test-failure tail be posted as a
# commit comment (readable via the public API). Remove once CI is green.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + tests + docs + benches (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        shell: bash
        # TEMP-DEBUG: on failure, post the tail of the test output as a
        # commit comment (readable via the public commits API). Remove once
        # CI is green; requires the contents: write permission below.
        run: |
          set +e
          : > /tmp/tests.txt
          cargo test -p wasi-runtime --all-features 2>&1 | tee /tmp/tests.txt
          runtime_status=${PIPESTATUS[0]}
          if [ $runtime_status -eq 0 ]; then
            cargo test --workspace --exclude wasi-runtime --all-features 2>&1 | tee -a /tmp/tests.txt
            workspace_status=${PIPESTATUS[0]}
          else
            workspace_status=0
          fi
          status=$runtime_status
          [ $status -eq 0 ] && status=$workspace_status
          if [ $status -ne 0 ]; then
            {
              echo "Tests failed on $RUNNER_OS (exit $status):"
              echo '```'
              tail -120 /tmp/tests.txt | cut -c1-200
              echo '```'
            } > /tmp/comment-body.md
          fi
          exit $status

      - name: Upload test log (diagnostic)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: /tmp/tests.txt
          if-no-files-found: ignore

      - name: Prepare failure report
        id: prepare
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/comment-body.md ]; then
            echo "report_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report test failures on commit
        if: steps.prepare.outputs.report_ready == 'true'
        uses: peter-evans/commit-comment@v4
        with:
          body-path: /tmp/comment-body.md

      - name: Docs (broken links are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  performance:
    name: WASI hot-path benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Criterion hot-path benchmarks
        run: cargo bench -p wasi-runtime --bench runtime_hot_paths -- --noplot

      - name: Upload Criterion report
        uses: actions/upload-artifact@v4
        with:
          name: wasi-runtime-criterion-report
          path: target/criterion
          if-no-files-found: error

  licenses:
    name: license + advisory checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check licenses, advisories, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

      - name: Audit dependencies (RustSec)
        uses: actions-rust-lang/audit@v1
