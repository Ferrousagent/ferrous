name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
  schedule:
    # Nightly advisory sweep: RustSec advisories can be published any day.
    - cron: '0 0 * * *'
  workflow_dispatch:

# Kill stale runs when a newer push lands on the same branch.
# TEMP-DEBUG: contents:write lets the clippy failure tail be posted as a
# commit comment (readable via the public API). Remove with the debug step.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + tests + docs + benches (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        # TEMP-DEBUG: emit clippy error lines as file/line ::error::
        # annotations (visible via the public check-run annotations API).
        # Remove once the violations are fixed.
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/clippy.txt
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Strip ANSI colour codes and emit each clippy error as one
            # annotation with real file/line metadata parsed from the `-->`
            # note, so GitHub attaches it to the source file (public API).
            sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/clippy.txt > /tmp/clippy_clean.txt
            python3 - <<'PYEOF'
import re
lines = open('/tmp/clippy_clean.txt').read().splitlines()
i = 0
blocks = []
while i < len(lines):
    line = lines[i]
    if re.match(r'^(error|warning)(\[|:)', line):
        title = line
        loc = ''
        body = []
        j = i + 1
        while j < len(lines):
            nxt = lines[j]
            if re.match(r'^(error|warning)(\[|:)', nxt):
                break
            m = re.search(r'--> ([^:]+):(\d+):(\d+)', nxt)
            if m and not loc:
                loc = (m.group(1), int(m.group(2)), int(m.group(3)))
            body.append(nxt)
            j += 1
        blocks.append((title, loc, body))
        i = j
    else:
        i += 1
for title, loc, body in blocks[:25]:
    if loc:
        path, ln, col = loc
        print(f'::error file={path},line={ln},col={col},title=clippy::{title}')
    else:
        print(f'::error title=clippy::{title}')
    for b in body[:8]:
        print(b)
PYEOF
          fi
          exit $status

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Docs (broken links are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  performance:
    name: WASI hot-path benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Criterion hot-path benchmarks
        run: cargo bench -p wasi-runtime --bench runtime_hot_paths -- --noplot

      - name: Upload Criterion report
        uses: actions/upload-artifact@v4
        with:
          name: wasi-runtime-criterion-report
          path: target/criterion
          if-no-files-found: error

  licenses:
    name: license + advisory checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check licenses, advisories, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

      - name: Audit dependencies (RustSec)
        uses: actions-rust-lang/audit@v1
