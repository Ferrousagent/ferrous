name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
  schedule:
    # Nightly advisory sweep: RustSec advisories can be published any day.
    - cron: '0 0 * * *'
  workflow_dispatch:

# Kill stale runs when a newer push lands on the same branch.
# TEMP-DEBUG: contents:write lets the clippy failure tail be posted as a
# commit comment (readable via the public API). Remove with the debug step.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + tests + docs + benches (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        shell: bash
        # TEMP-DEBUG: emit clippy error lines as file/line ::error::
        # annotations (visible via the public check-run annotations API).
        # Remove once the violations are fixed.
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/clippy.txt
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Strip ANSI colour codes and emit each clippy error as one
            # annotation with real file/line metadata parsed from the `-->`
            # note, so GitHub attaches it to the source file (public API).
            sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/clippy.txt \
              | awk '/^(error|warning)(\[|:)/ { title=$0; getline; \
                      if ($0 ~ /-->/ ) { loc=$0; sub(/^.*--> /, "", loc); \
                        n=split(loc, q, ":"); \
                        if (n == 3) { printf "::error file=%s,line=%s,col=%s::%s\n", q[1], q[2], q[3], title } \
                        else { print "::error::" title } } \
                      else { print "::error::" title } }' \
              | head -40
          fi
          exit $status

      - name: Tests
        shell: bash
        # TEMP-DEBUG: isolate package/test hangs and expose the bounded tail.
        run: |
          set +e
          : > /tmp/tests.txt
          timeout 300 cargo test -p wasi-runtime --all-features -- --nocapture --test-threads=1 2>&1 | tee -a /tmp/tests.txt
          runtime_status=${PIPESTATUS[0]}
          if [ $runtime_status -eq 0 ]; then
            timeout 300 cargo test --workspace --exclude wasi-runtime --all-features -- --nocapture --test-threads=1 2>&1 | tee -a /tmp/tests.txt
            workspace_status=${PIPESTATUS[0]}
          else
            workspace_status=0
          fi
          status=$runtime_status
          [ $status -eq 0 ] && status=$workspace_status
          if [ $status -ne 0 ]; then
            sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/tests.txt \
              | tail -120 \
              | while IFS= read -r line; do
                  [ -n "$line" ] && echo "::error file=.github/workflows/ci.yml,line=75,title=test-output::$line"
                done
          fi
          exit $status

      - name: Docs (broken links are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  performance:
    name: WASI hot-path benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Criterion hot-path benchmarks
        run: cargo bench -p wasi-runtime --bench runtime_hot_paths -- --noplot

      - name: Upload Criterion report
        uses: actions/upload-artifact@v4
        with:
          name: wasi-runtime-criterion-report
          path: target/criterion
          if-no-files-found: error

  licenses:
    name: license + advisory checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check licenses, advisories, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

      - name: Audit dependencies (RustSec)
        uses: actions-rust-lang/audit@v1
