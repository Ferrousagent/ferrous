name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
  schedule:
    # Nightly advisory sweep: RustSec advisories can be published any day.
    - cron: '0 0 * * *'
  workflow_dispatch:

# Kill stale runs when a newer push lands on the same branch.
# TEMP-DEBUG: contents:write lets the clippy failure tail be posted as a
# commit comment (readable via the public API). Remove with the debug step.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + tests + docs + benches (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        # TEMP-DEBUG: on failure, post the clippy tail as a commit comment
        # (publicly readable via API) so the error text is reachable without
        # admin log access. Remove once the violations are fixed.
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/clippy.txt
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            tail -120 /tmp/clippy.txt | python3 -c "
          import json, os, sys, urllib.request
          body = sys.stdin.read()
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GITHUB_TOKEN']
          url = f'https://api.github.com/repos/{repo}/commits/{sha}/comments'
          data = json.dumps({'body': '```\\n' + body[-64000:] + '\\n```'}).encode()
          req = urllib.request.Request(url, data=data, method='POST', headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
          urllib.request.urlopen(req)
          "
          fi
          exit $status

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Docs (broken links are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  performance:
    name: WASI hot-path benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Criterion hot-path benchmarks
        run: cargo bench -p wasi-runtime --bench runtime_hot_paths -- --noplot

      - name: Upload Criterion report
        uses: actions/upload-artifact@v4
        with:
          name: wasi-runtime-criterion-report
          path: target/criterion
          if-no-files-found: error

  licenses:
    name: license + advisory checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check licenses, advisories, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

      - name: Audit dependencies (RustSec)
        uses: actions-rust-lang/audit@v1
