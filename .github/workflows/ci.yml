name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
  schedule:
    # Nightly advisory sweep: RustSec advisories can be published any day.
    - cron: '0 0 * * *'
  workflow_dispatch:

# Kill stale runs when a newer push lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + tests + docs + benches (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build tests
        run: cargo test -p wasi-runtime --lib --all-features --no-run

      - name: Tests (per-module isolation)
        shell: bash
        # TEMP-DEBUG: run each wasi-runtime test module separately with a
        # hard timeout so a hang/OOM is attributed to its module instead of
        # freezing the whole suite. Full log is read via `gh run view --log`.
        # Remove once the freeze is fixed.
        run: |
          set +e
          BIN=
          for f in $(ls -t target/debug/deps/wasi_runtime-* 2>/dev/null); do
            if [ -f "$f" ] && [ -x "$f" ]; then BIN="$f"; break; fi
          done
          if [ -z "$BIN" ]; then echo "test binary not found"; exit 1; fi
          echo "BIN=$BIN"
          command -v python3 >/dev/null 2>&1 && PY=python3 || PY=python
          mods="shell_parse shell_ir shell_executor builtin terminal_session broker contract_tests native native_session elevation policy pipe capability command cancel"
          failed=0
          for m in $mods; do
            echo "=== MODULE: $m ==="
            $PY -c "
          import subprocess, sys
          try:
              proc = subprocess.run([sys.argv[1], sys.argv[2] + '::'], timeout=110)
              sys.exit(proc.returncode)
          except subprocess.TimeoutExpired:
              print('TIMED OUT after 110s:', sys.argv[2])
              sys.exit(124)
          " "$BIN" "$m"
            s=$?
            if [ $s -eq 124 ] || [ $s -eq 137 ]; then
              echo "!!! MODULE HUNG/KILLED: $m (exit $s)"
              failed=1
            elif [ $s -ne 0 ]; then
              echo "!!! MODULE FAILED: $m (exit $s)"
              failed=1
            fi
          done
          echo "=== wasi-runtime modules done (failed=$failed) ==="
          exit $failed

      - name: Tests (other crates)
        shell: bash
        run: cargo test --workspace --exclude wasi-runtime --all-features

      - name: Docs (broken links are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  performance:
    name: WASI hot-path benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Criterion hot-path benchmarks
        run: cargo bench -p wasi-runtime --bench runtime_hot_paths -- --noplot

      - name: Upload Criterion report
        uses: actions/upload-artifact@v4
        with:
          name: wasi-runtime-criterion-report
          path: target/criterion
          if-no-files-found: error

  licenses:
    name: license + advisory checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check licenses, advisories, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

      - name: Audit dependencies (RustSec)
        uses: actions-rust-lang/audit@v1
